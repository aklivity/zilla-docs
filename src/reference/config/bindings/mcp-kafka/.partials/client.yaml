mcp_kafka_client:
  type: mcp-kafka
  kind: client
  options:
    servers:
      - kafka.examples.dev:9092
  routes:
    - when:
        - tool: create_topics
        - tool: delete_topics
        - tool: alter_configs
        - tool: reset_offsets
      guarded:
        my_guard:
          - kafka:admin
    - when:
        - tool: produce
          topics: [ orders ]
      guarded:
        my_guard:
          - kafka:write
    - when:
        - tool: consume
          topics: [ orders ]
    - when:
        - tool: describe_configs
        - tool: list_topics
        - tool: describe_topic
        - tool: cluster_overview
        - tool: list_brokers
        - tool: describe_cluster
        - tool: list_consumer_groups
        - tool: describe_consumer_group
